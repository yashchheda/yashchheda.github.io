<!doctype html>
<!--
  SOURCE FOR public/og.png — the social share card.

  Rendered to PNG with headless Chrome rather than committed as an unexplained
  binary, so the card can be edited and regenerated. See README (Social share
  card) for the exact command.

  Palette and fonts are copied from src/styles/global.css deliberately: the card
  is rendered outside Astro, so it cannot import the theme tokens. If the brand
  colour or typeface changes there, change it here and re-render.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <style>
      :root {
        --canvas: #080b10;
        --line: #1e2a36;
        --ink: #e6edf5;
        --muted: #93a4b6;
        --faint: #5f7183;
        --brand: #2c5f8a;
        --brand-300: #7fb3d9;
        --signal: #3dd68c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Exactly the Open Graph 1200x630 canvas. No scrollbars, no scaling. */
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--canvas);
        font-family: 'Inter Variable', system-ui, sans-serif;
        color: var(--ink);
        position: relative;
      }

      /* Faint grid + brand glow: echoes the site's dark surface without
         competing with the text. */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(30, 42, 54, 0.55) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(30, 42, 54, 0.55) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 90% 80% at 22% 18%, #000 35%, transparent 78%);
      }

      .glow {
        position: absolute;
        top: -280px;
        left: -180px;
        width: 900px;
        height: 700px;
        background: radial-gradient(circle at center, rgba(44, 95, 138, 0.42), transparent 66%);
      }

      /* Brand edge bar, mirroring the accent used on the resume PDF. */
      .edge {
        position: absolute;
        top: 0;
        left: 0;
        width: 10px;
        height: 100%;
        background: linear-gradient(to bottom, var(--brand-300), var(--brand) 55%, transparent);
      }

      .inner {
        position: relative;
        height: 100%;
        padding: 72px 80px 64px 90px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .kicker {
        font-family: 'JetBrains Mono Variable', ui-monospace, monospace;
        font-size: 19px;
        color: var(--faint);
        letter-spacing: 0.01em;
      }
      .kicker .prompt {
        color: var(--signal);
      }

      .name {
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .role {
        margin-top: 20px;
        font-size: 33px;
        font-weight: 600;
        color: var(--brand-300);
        letter-spacing: -0.012em;
      }

      .discipline {
        margin-top: 8px;
        font-size: 25px;
        color: var(--muted);
        letter-spacing: -0.005em;
      }

      /* Metrics: the three figures cleared for publication. */
      .metrics {
        display: flex;
        gap: 56px;
        font-family: 'JetBrains Mono Variable', ui-monospace, monospace;
      }
      .metric .figure {
        font-size: 34px;
        font-weight: 700;
        color: var(--ink);
      }
      .metric .label {
        margin-top: 6px;
        font-size: 16px;
        color: var(--faint);
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 26px;
      }

      .compliance {
        font-family: 'JetBrains Mono Variable', ui-monospace, monospace;
        font-size: 16px;
        color: var(--faint);
      }

      .url {
        font-family: 'JetBrains Mono Variable', ui-monospace, monospace;
        font-size: 20px;
        color: var(--brand-300);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="edge"></div>

    <div class="inner">
      <div>
        <div class="kicker"><span class="prompt">&#10095;</span> whoami</div>
        <div class="name">Yash Chheda</div>
        <div class="role">Software Engineering Manager</div>
        <div class="discipline">Cloud Native Platform Engineering &middot; Appian</div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="figure">100+</div>
          <div class="label">Kubernetes clusters</div>
        </div>
        <div class="metric">
          <div class="figure">25+</div>
          <div class="label">AWS accounts</div>
        </div>
        <div class="metric">
          <div class="figure">25</div>
          <div class="label">AWS regions</div>
        </div>
      </div>

      <div class="footer">
        <div class="compliance">FedRAMP &middot; SOC 2 &middot; HIPAA &middot; PCI DSS &middot; DoD IL5</div>
        <div class="url">yashchheda.github.io</div>
      </div>
    </div>
  </body>
</html>

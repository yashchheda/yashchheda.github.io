name: Deploy to GitHub Pages

# Deliberately does NOT run on feature branches: a Pages deployment from a
# branch would publish unreviewed content to the live site. Runs on master
# (this repo's default branch — there is no `main`) plus manual dispatch.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, mint an OIDC token
# for the deploy step. No broader write access to contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; cancel-in-progress is off so an
# in-flight publish is allowed to finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the build uses the exact tree in
      # package-lock.json and cannot silently pick up a new minor.
      - name: Install dependencies
        run: npm ci

      # Type-check templates as well as TS. `astro build` alone does not do
      # this, and it has already caught real errors in this repo.
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

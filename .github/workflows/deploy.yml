name: Deploy to GitHub Pages

# Two jobs on one workflow so PRs and master run the *same* build:
#   - `build` runs on both. On a pull request it stops after `astro build`, so a
#     type error or broken build is caught before merge rather than turning
#     master red at deploy time.
#   - `deploy` is gated to non-PR events. A Pages deployment from a pull request
#     would publish unreviewed content to the live site, so PRs must never
#     reach it. Branch pushes other than master do not trigger the workflow at
#     all.
# master is this repo's default branch — there is no `main`.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, mint an OIDC token
# for the deploy step. No broader write access to contents. Pull requests use
# only `contents: read`; the steps needing the other two are skipped on PRs.
permissions:
  contents: read
  pages: write
  id-token: write

# Production deploys share one queue and are never cancelled, so an in-flight
# publish finishes rather than leaving Pages half-updated. Pull requests get
# their own per-ref queue and *are* cancelled when superseded, so a stale PR
# build cannot sit in front of a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the build uses the exact tree in
      # package-lock.json and cannot silently pick up a new minor.
      - name: Install dependencies
        run: npm ci

      # Type-check templates as well as TS. `astro build` alone does not do
      # this, and it has already caught real errors in this repo.
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Pages-specific steps are pointless on a pull request and would use the
      # pages/id-token permissions a PR has no need for. Skipped there; the PR
      # still gets full value from check + build above.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Never deploy from a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
